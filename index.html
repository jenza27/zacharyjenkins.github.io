<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zachary Jenkins</title>
<link rel="icon" type="image/png" href="Favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root { --accent: #F2F2F2; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b1a2b;
  font-family: 'Inter', sans-serif;
  color: #fff;
}

/* ── Canvas: locked to viewport ── */
.canvas {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ── Background video ── */
.bg-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.bg-layer video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.22;
}

.bg-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center,
    rgba(11,26,43,0.2) 0%,
    rgba(11,26,43,0.8) 100%
  );
}

/* ── Main scene ── */
.scene {
  position: relative;
  z-index: 2;
  text-align: center;
  transform: scale(0.35);
  transform-origin: center center;
  will-change: transform;
  white-space: nowrap;
}

.scene h1 {
  font-family: 'Oswald', sans-serif;
  font-size: 4.5rem;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: #ffffff;
  font-weight: 700;
  line-height: 1;
}

.scene p {
  font-family: 'Inter', sans-serif;
  color: #cccccc;
  font-size: 0.9rem;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-top: 14px;
}

.hero-nav {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-top: 38px;
}

.hero-nav a {
  font-family: 'Oswald', sans-serif;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #ffffff;
  text-decoration: none;
  padding: 10px 26px;
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 4px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(4px);
  pointer-events: none;
  opacity: 0;
  transform: translateY(10px);
  transition: background 0.2s ease, border-color 0.2s ease, opacity 0.4s ease, transform 0.4s ease;
}

.hero-nav a.ready {
  pointer-events: all;
  opacity: 1;
  transform: translateY(0);
}

.hero-nav a:hover {
  background: rgba(255,255,255,0.15);
  border-color: #ffffff;
}

/* ── Depth elements ── */
.depth-el {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 1;
  opacity: 0;
  will-change: transform, opacity;
  pointer-events: none;
  transform: translate(-50%, -50%);
}

.depth-el.cross {
  font-size: 1.4rem;
  font-weight: 200;
  color: rgba(255,255,255,0.3);
}

.depth-el.label {
  font-family: 'Oswald', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
}

.depth-el.line-h {
  width: 50px;
  height: 1px;
  background: rgba(255,255,255,0.2);
}

.depth-el.line-v {
  width: 1px;
  height: 40px;
  background: rgba(255,255,255,0.2);
}

.depth-el.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
}

.depth-el.ring {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  background: transparent;
}

/* ── Scroll hint ── */
.scroll-hint {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-family: 'Oswald', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: opacity 0.4s ease;
}

.scroll-hint .arrow {
  width: 1px;
  height: 30px;
  background: rgba(255,255,255,0.25);
  animation: pulse 1.6s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.2; transform: scaleY(1); }
  50%       { opacity: 0.7; transform: scaleY(1.15); }
}
</style>
</head>

<body>

<div class="canvas">

  <!-- Background -->
  <div class="bg-layer">
    <video autoplay muted loop playsinline>
      <source src="title-video.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Depth elements — data-fx (vw), data-fy (vh) = final offset from center -->
  <div class="depth-el cross"  data-fx="-38" data-fy="-26">+</div>
  <div class="depth-el cross"  data-fx=" 37" data-fy="-20">+</div>
  <div class="depth-el cross"  data-fx="-10" data-fy=" 34">+</div>
  <div class="depth-el cross"  data-fx=" 14" data-fy="-33">+</div>
  <div class="depth-el label"  data-fx="-44" data-fy="  3">Advertising</div>
  <div class="depth-el label"  data-fx=" 38" data-fy="  7">Design</div>
  <div class="depth-el label"  data-fx="-16" data-fy="-35">Portfolio</div>
  <div class="depth-el label"  data-fx=" 30" data-fy=" 32">2025</div>
  <div class="depth-el line-h" data-fx="-32" data-fy=" 28"></div>
  <div class="depth-el line-h" data-fx=" 26" data-fy="-30"></div>
  <div class="depth-el line-v" data-fx=" 42" data-fy=" 20"></div>
  <div class="depth-el line-v" data-fx="-40" data-fy="-14"></div>
  <div class="depth-el dot"    data-fx="-22" data-fy=" 20"></div>
  <div class="depth-el dot"    data-fx=" 28" data-fy="-22"></div>
  <div class="depth-el dot"    data-fx=" 20" data-fy=" 18"></div>
  <div class="depth-el ring"   data-fx="-30" data-fy="-30"></div>
  <div class="depth-el ring"   data-fx=" 35" data-fy=" 25"></div>

  <!-- Main scene -->
  <div class="scene">
    <h1>Zachary Jenkins</h1>
    <p>Creative Advertising &amp; Design</p>
    <nav class="hero-nav">
      <a href="work.html">Work</a>
      <a href="art.html">Art</a>
      <a href="resume.html">Resume</a>
    </nav>
  </div>

</div>

<!-- Scroll hint -->
<div class="scroll-hint" id="scrollHint">
  <span>Scroll</span>
  <div class="arrow"></div>
</div>

<script>
const scene      = document.querySelector('.scene');
const depthEls   = document.querySelectorAll('.depth-el');
const navLinks   = document.querySelectorAll('.hero-nav a');
const scrollHint = document.getElementById('scrollHint');

let progress       = 0;  // current animated value
let targetProgress = 0;  // where we're heading

// ── Wheel input ──
window.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetProgress = Math.max(0, Math.min(1, targetProgress + e.deltaY / 1800));
}, { passive: false });

// ── Touch input (mobile) ──
let touchStartY = 0;
window.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove', e => {
  const delta = touchStartY - e.touches[0].clientY;
  touchStartY  = e.touches[0].clientY;
  targetProgress = Math.max(0, Math.min(1, targetProgress + delta / 600));
}, { passive: true });

function easeOut(t) {
  return 1 - Math.pow(1 - t, 3);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function draw(p) {
  const e = easeOut(p);

  // Scene: scale 0.35 → 1
  scene.style.transform = `scale(${0.35 + e * 0.65})`;

  // Depth elements: fly outward from center
  depthEls.forEach(el => {
    const fx      = parseFloat(el.dataset.fx);
    const fy      = parseFloat(el.dataset.fy);
    const x       = fx * e;
    const y       = fy * e;
    const scale   = 0.3 + e * 0.7;
    const opacity = Math.min(e * 1.8, 0.65);
    el.style.transform = `translate(calc(-50% + ${x}vw), calc(-50% + ${y}vh)) scale(${scale})`;
    el.style.opacity    = opacity;
  });

  // Nav links: clickable near end
  const ready = p >= 0.88;
  navLinks.forEach(a => a.classList.toggle('ready', ready));

  // Scroll hint: fade out once moving
  scrollHint.style.opacity = p > 0.05 ? 0 : 1;
}

// ── RAF loop with lerp smoothing ──
function tick() {
  progress = lerp(progress, targetProgress, 0.07);
  draw(progress);
  requestAnimationFrame(tick);
}

tick();
</script>

</body>
</html>
