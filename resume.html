<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume — Zachary Jenkins</title>
<link rel="icon" type="image/png" href="Favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

:root {
  --accent: #F2F2F2;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #0b1a2b;
  color: #fff;
}

.site-nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 14px 30px;
  background: rgba(11,26,43,0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  box-sizing: border-box;
}

.site-nav a {
  font-family: 'Oswald', sans-serif;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  transition: color 0.2s ease;
}

.site-nav a:hover,
.site-nav a.active {
  color: #ffffff;
}

.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

.hero::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 200px;
  background: linear-gradient(to bottom, rgba(11,26,43,0), rgba(11,26,43,1));
  z-index: 1;
}

.hero-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 1;
}

.hero-overlay {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 60px;
}

.hero-nav {
  display: flex;
  gap: 20px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 1s ease 0.3s;
}

.hero-nav a {
  font-family: 'Oswald', sans-serif;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #ffffff;
  text-decoration: none;
  padding: 10px 24px;
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 4px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(4px);
  transition: background 0.2s ease, border-color 0.2s ease;
}

.hero-nav a:hover {
  background: rgba(255,255,255,0.15);
  border-color: #ffffff;
}
</style>
</head>

<body>

<nav class="site-nav">
  <a href="index.html">Home</a>
  <a href="work.html">Work</a>
  <a href="art.html">Art</a>
  <a href="resume.html" class="active">Resume</a>
</nav>

<div class="hero">
  <video muted loop playsinline class="hero-video" id="resumeVideo">
    <source src="NAME-RESUME.mp4" type="video/mp4">
  </video>

  <div class="hero-overlay">
    <nav class="hero-nav">
      <a href="work.html">Work</a>
      <a href="art.html">Art</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</div>

<script>
window.addEventListener("load", () => {
  document.querySelector(".hero-nav").style.opacity = 1;
  document.querySelector(".hero-nav").style.transform = "translateY(0)";
});

const video = document.getElementById("resumeVideo");

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      video.play();
    } else {
      video.pause();
    }
  });
}, { threshold: 0.3 });

observer.observe(document.querySelector(".hero"));
</script>

</body>
</html>
